services:
  api:
    build: ./services/api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      STORAGE_DIR: /data
    volumes:
      - toolkit-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  worker:
    build: ./services/api
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      STORAGE_DIR: /data
    volumes:
      - toolkit-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  toolkit-data:
  redis-data:
