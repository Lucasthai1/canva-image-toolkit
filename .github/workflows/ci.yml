name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-lab/requirements.txt
      - name: Install lab dependencies
        run: python -m pip install -r python-lab/requirements.txt
      - name: Test lab
        working-directory: python-lab
        run: python -m pytest -q
      - name: Compile lab
        run: python -m compileall python-lab

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Test API
        working-directory: services/api
        run: python -m pytest -q
      - name: Compile API
        run: python -m compileall services/api
